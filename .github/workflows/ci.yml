name: CI

on:
  push:
    branches: ['**']

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
          POSTGRES_DB: aim_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U aim" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:test:deploy
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  e2e:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
          POSTGRES_DB: aim
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U aim" --health-interval 5s --health-retries 10
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:e2e
