services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim
    ports: ['5433:5432']
    volumes: ['aim-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aim']
      interval: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim_test
    ports: ['5434:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aim']
      interval: 5s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports: ['12111:12111']

volumes:
  aim-db:
